<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Resume Builder</title>
    <link href="./public/assets/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container py-5">
        <div class="progress mb-4" role="progressbar" aria-label="Wizard progress" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
            <div id="divProgressBar" class="progress-bar" style="width:25%">Progress</div>
        </div>

        <div class="card col-12 col-lg-8 mx-auto" id="divStepUserInfo">
            <div class="card-body p-4">
                <h2 class="h4 text-center mb-3">Step 1: User Info</h2>
                <form id="frmUserInfo" novalidate>
                    <input class="form-control mb-2" name="firstName" placeholder="First Name" required aria-label="First Name">
                    <input class="form-control mb-2" name="lastName" placeholder="Last Name" required aria-label="Last Name">
                    <input class="form-control mb-2" name="email" placeholder="Email" required type="email" aria-label="Email">
                    <input class="form-control mb-2" name="geminiApiKey" placeholder="Gemini API Key" aria-label="Gemini API Key">
                    <input class="form-control mb-3" name="desiredRole" placeholder="Desired Role" required aria-label="Desired Role">
                    <div id="divUserFormErrors" class="alert alert-danger py-2 mb-3 d-none" role="alert" aria-live="assertive"></div>
                    <button id="btnUserSubmit" class="btn btn-primary w-100" type="submit">Next</button>
                </form>
            </div>
        </div>

        <div class="card col-12 col-lg-8 mx-auto d-none" id="divStepJobs">
            <div class="card-body p-4">
                <h2 class="h4 text-center mb-3">Step 2: Jobs</h2>
                <form id="frmJobs">
                    <div id="divJobsContainer"></div>
                    <button id="btnAddJob" class="btn btn-outline-secondary w-100 mb-2" type="button">Add Another Job</button>
                    <button class="btn btn-primary w-100" type="submit">Next</button>
                </form>
            </div>
        </div>

        <div class="card col-12 col-lg-8 mx-auto d-none" id="divStepResponsibilities">
            <div class="card-body p-4">
                <h2 class="h4 text-center mb-3">Step 3: Responsibilities & AI</h2>
                <form id="frmResponsibilities">
                    <div id="divResponsibilitiesContainer"></div>
                    <button class="btn btn-primary w-100" type="submit">Next</button>
                </form>
            </div>
        </div>

        <div class="card col-12 col-lg-8 mx-auto d-none" id="divStepCredentials">
            <div class="card-body p-4">
                <h2 class="h4 text-center mb-3">Step 4: Certifications & Awards</h2>
                <form id="frmCredentials">
                    <div id="divCertificationsContainer" class="mb-3"></div>
                    <button id="btnAddCertification" class="btn btn-outline-secondary w-100 mb-3" type="button">Add Certification</button>
                    <div id="divAwardsContainer" class="mb-3"></div>
                    <button id="btnAddAward" class="btn btn-outline-secondary w-100 mb-3" type="button">Add Award</button>
                    <button class="btn btn-success w-100" type="submit">Save Resume Data</button>
                </form>
            </div>
        </div>
    </div>

    <script src="./public/assets/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./public/js/app.js"></script>
</body>
</html>
