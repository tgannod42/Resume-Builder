<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Resume Builder</title>
    <link href="./public/assets/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card col-11 col-md-5" id="divStepUserInfo" style="font-size: large;">
            <div class="card-body p-4">
                
                <h2 class="text-center mb-2">RC Resume Builder</h2>
                <h3 class="h5 text-center text-muted mb-4">Step 1: Personal Details</h3>
                
                <form id="frmUserInfo" novalidate>
                    
                    <label class="form-label" for="txtFirstName">First Name</label>
                    <input class="form-control mb-3" id="txtFirstName" name="firstName" type="text" required aria-label="First Name">
                    
                    <label class="form-label" for="txtLastName">Last Name</label>
                    <input class="form-control mb-3" id="txtLastName" name="lastName" type="text" required aria-label="Last Name">
                    
                    <label class="form-label" for="txtEmail">Email Address</label>
                    <input class="form-control mb-3" id="txtEmail" name="email" type="email" required aria-label="Email Address">
                    
                    <label class="form-label" for="txtTargetRole">Target Role Title</label>
                    <input class="form-control mb-2" id="txtTargetRole" name="targetRoleTitle" type="text" placeholder="e.g., Frontend Developer" required aria-label="Target Role Title">
                    
                    <hr class="my-4" />
                    
                    <button id="btnNextToJobs" class="btn btn-info col-12 fw-bold" type="submit">Next: Work Experience</button>
                </form>

            </div>
        </div>
        
        <div class="card col-11 col-md-5" style="display: none;" id="divStepJobs">
            <div class="card-body p-4">
                <h2 class="text-center mb-2">RC Resume Builder</h2>
                <h3 class="h5 text-center text-muted mb-4">Step 2: Work Experience</h3>
                <button id="btnBackToUserInfo" class="btn btn-secondary col-12 mt-2" type="button">Back</button>
            </div>
        </div>

    </div>
    
    <script src="./public/assets/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./public/js/app.js"></script>
</body>
</html>
